name: Validate issue 15485

on:
  push:
    branches:
      - fix/mock-llm-run-isolation-15485
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: fix/mock-llm-run-isolation-15485

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolation unit tests
        run: npx vitest run __tests__/e2e/mock-llm-run-isolation.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check playwright.mock-llm.config.ts playwright.mock-llm-docker.config.ts tests/e2e/mock-llm/run-isolation.ts tests/e2e/mock-llm/utils/skill-test-helpers.ts tests/e2e/mock-llm/utils/mock-llm-helpers.ts __tests__/e2e/mock-llm-run-isolation.test.ts tests/e2e/mock-llm/mcp/mock-llm-mcp-github.spec.ts tests/e2e/mock-llm/mcp/mock-llm-mcp-slack-credentials.spec.ts tests/e2e/mock-llm/automations/mock-llm-preset-automation.spec.ts tests/e2e/mock-llm/automations/mock-llm-automation.spec.ts tests/e2e/mock-llm/conversations/mock-llm-conversation.spec.ts tests/e2e/mock-llm/conversations/mock-llm-image-upload.spec.ts tests/e2e/mock-llm/skills/mock-llm-skills.spec.ts tests/e2e/mock-llm/files/mock-llm-files-and-git.spec.ts tests/e2e/mock-llm/home/mock-llm-folder-workspace.spec.ts tests/e2e/mock-llm/settings/mock-llm-model-switch.spec.ts tests/e2e/mock-llm/settings/mock-llm-profile-management.spec.ts tests/e2e/mock-llm/onboarding/mock-llm-onboarding-happy-path.spec.ts AGENTS.md
